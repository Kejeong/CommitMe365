<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-ink-gradient {
            background: linear-gradient(135deg, #000000 0%, #111C2D 100%);

            outline: 1px solid rgba(118, 119, 125, 0.2);
        }

<body class="bg-background font-body text-on-surface selection:bg-tertiary-fixed selection:text-on-tertiary-fixed">
<main class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
<!-- Background Decorative Elements -->
<div class="absolute top-0 left-0 w-full h-full -z-10">
<div class="absolute top-[-10%] right-[-5%] w-[40%] h-[60%] bg-surface-container-low rounded-full blur-[120px] opacity-60"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[30%] h-[50%] bg-secondary-container/20 rounded-full blur-[100px] opacity-40"></div>
</div>
<div class="w-full max-w-md">
<!-- Brand Anchor -->
<div class="mb-12 text-center md:text-left">
<h1 class="font-headline font-black text-4xl tracking-tight text-primary mb-2">CommitMe365</h1>
<p class="font-label text-sm text-on-surface-variant uppercase tracking-widest">Authentication Gateway</p>
</div>
<!-- Login Card -->
<section class="bg-surface-container-lowest p-8 md:p-12 shadow-[0_8px_24px_rgba(25,28,30,0.04)] rounded-xl relative">
<header class="mb-10">
<h2 class="font-headline font-bold text-2xl text-on-surface">다시 오신 것을 환영합니다</h2>
<p class="text-on-surface-variant mt-2">서비스 이용을 위해 계정 정보를 입력해주세요.</p>
</header>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label text-xs font-bold text-on-surface-variant uppercase tracking-wider" for="email">이메일 주소</label>
<input class="w-full px-4 py-3 bg-surface-container-low ghost-border rounded-lg focus:ring-2 focus:ring-primary focus:outline-none transition-all font-body placeholder:text-outline/50" id="email" placeholder="curator@digital.tech" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-end">
<label class="font-label text-xs font-bold text-on-surface-variant uppercase tracking-wider" for="password">비밀번호</label>
<a class="font-label text-xs text-on-tertiary-container hover:underline transition-all" href="#">비밀번호를 잊으셨나요?</a>
</div>
<input class="w-full px-4 py-3 bg-surface-container-low ghost-border rounded-lg focus:ring-2 focus:ring-primary focus:outline-none transition-all font-body placeholder:text-outline/50" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- CTA Button -->
<button class="w-full bg-ink-gradient text-on-primary font-headline font-bold py-4 rounded-lg shadow-lg hover:translate-y-[-1px] active:scale-[0.98] transition-all" type="submit">
                        대시보드 로그인
                    </button>
</form>
<!-- Divider -->
<div class="relative my-10 flex items-center">
<div class="flex-grow h-[1px] bg-surface-variant"></div>
<span class="px-4 font-label text-[10px] text-outline uppercase tracking-[0.2em] bg-surface-container-lowest">또는 다음 계정으로 계속하기</span>
<div class="flex-grow h-[1px] bg-surface-variant"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 px-4 py-3 ghost-border rounded-lg hover:bg-surface-container-high transition-colors group">
<img alt="" class="w-5 h-5 grayscale group-hover:grayscale-0 transition-all" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCBWJYKl6XTB37uf9anvsVLukZjSJaokYHQtu0HPVp8RdXx4XeziV09O0ojJnMwx6eWdMairoQ23Fdvo7ZJujUKUXKJpdqvHv7J4oGhzpdSAWXSc4HME3mCLUsVuQ23VzO5fvTYlquQ27WYWM6CcWq8J7BvMmgjNiS4A1el-kO48v3XuPYI0p9XdSZuwcfYZkN0o3DtoebUL8w5jO05I1gnh44V-YrL27NnU7jn46dF6KFF0BK5Nz_u2WLOwOZ_35uNdlaJKeW-kOY"/>
<span class="font-label text-sm font-medium">구글</span>
</button>
<button class="flex items-center justify-center gap-3 px-4 py-3 bg-primary text-on-primary rounded-lg hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined text-[20px]">terminal</span>
<span class="font-label text-sm font-medium">깃허브</span>
</button>
</div>
<footer class="mt-12 text-center">
<p class="text-sm text-on-surface-variant">
                        계정이 없으신가요? 
                        <a class="text-primary font-bold hover:underline" href="#">멤버십 신청하기</a>
</p>
</footer>
</section>
<!-- Metadata / Footer Link -->
<div class="mt-8 flex justify-between items-center px-2">
<span class="font-label text-[10px] text-outline uppercase tracking-widest">© 2024 CommitMe365</span>
<div class="flex gap-4">
<a class="font-label text-[10px] text-outline uppercase tracking-widest hover:text-primary transition-colors" href="#">Privacy</a>
<a class="font-label text-[10px] text-outline uppercase tracking-widest hover:text-primary transition-colors" href="#">Terms</a>
</div>
</div>
</div>
</main>
<!-- Global Footer Fragment -->
<footer class="w-full py-12 px-8 bg-slate-900 mt-auto border-t border-white/5">
<div class="flex flex-col md:flex-row justify-between items-center max-w-7xl mx-auto w-full gap-6">
<div class="text-slate-50 font-bold font-headline">CommitMe365</div>
<div class="flex flex-wrap justify-center gap-8">
<a class="font-label text-xs tracking-wider uppercase text-slate-500 hover:text-tertiary-fixed transition-colors" href="#">Privacy Policy</a>
<a class="font-label text-xs tracking-wider uppercase text-slate-500 hover:text-tertiary-fixed transition-colors" href="#">Terms of Service</a>
<a class="font-label text-xs tracking-wider uppercase text-slate-500 hover:text-tertiary-fixed transition-colors" href="#">API Documentation</a>
<a class="font-label text-xs tracking-wider uppercase text-slate-500 hover:text-tertiary-fixed transition-colors" href="#">RSS Feed</a>
</div>
<div class="font-label text-xs tracking-wider uppercase text-slate-300">© 2024. Engineered for clarity.</div>
</div>
</footer>
